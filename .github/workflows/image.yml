# Builds the image and publishes it to ghcr.io/quantum-aspen/aspen-net-transcriber.
#
# Tags: sha-<short> on every build; vX.Y.Z / X.Y on v* tags; latest on main.
# The deployments repo pins tag@sha256, so which tag moves doesn't matter there.
#
# The skills are baked in at build time from quantum-aspen/aspen-net-skills at
# SKILLS_REF. That repo sends `skills-updated` when its skills change, and the
# weekly run picks up anything missed.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  repository_dispatch:
    types: [skills-updated]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SKILLS_REPO: https://github.com/quantum-aspen/aspen-net-skills.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve skills revision
        id: skills
        run: |
          rev=$(git ls-remote "$SKILLS_REPO" refs/heads/main | cut -f1)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            io.github.quantum-aspen.skills.revision=${{ steps.skills.outputs.rev }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SKILLS_REF=${{ steps.skills.outputs.rev }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
