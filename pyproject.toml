[project]
name = "aspen-net-transcriber"
version = "0.1.0"
description = "Transcribes ASPEN-NET Zoom recordings on ncsa-01 and publishes summaries to the Outline wiki."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # used by the baked-in local-meeting-transcript skill's scripts
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 removed.
    # Lift this when faster-whisper releases a fix.
    "av==18.1.0",
    "yt-dlp==2026.6.9",
    # the service itself
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
]

[project.scripts]
transcriber = "transcriber.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transcriber"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
